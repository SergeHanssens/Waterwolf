name: Officiële bodemkaart controleren
on:
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rws-data-update
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.4.6 rasterio==1.4.4 pyproj==3.7.2
      - run: python scripts/build-bathymetry.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Bewaar gevalideerde bronupdate
        run: |
          git config user.name 'Waterwolf broncontrole'
          git config user.email 'waterwolf-data@users.noreply.github.com'
          git add data/bathymetry-ijsselmeer.json.gz data/bathymetry-metadata.json data/bathymetry-projection-controls.json
          if ! git diff --cached --quiet; then
            git commit -m 'Controleer officiële RWS-bodemkaart'
            git pull --rebase
            git push
          fi
